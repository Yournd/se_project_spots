<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Wyatt Yousey" />
    <meta name="keywords" content="social media, facebook, snapchat, instagram, friends, followers, likes" />
    <meta
      name="description"
      content="Social media website called Spots, where people can post any picture. They can also like other peoples pictures."
    />
    <title>Spots</title>
    <link rel="icon" href="/favicon.ico" />
    <meta name="title" property="og:title" content="Spots" />
    <meta property="og:type" content="Website" />
    <meta name="image" property="og:image" content="./images/preview__img.png" />
    <meta
      name="description"
      property="og:description"
      content="Social Media website that allows you to set a custom profile and make custom posts."
    />
    <meta name="author" content="Wyatt Yousey" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img class="header__logo" src="<%=require('./images/logo.svg')%>" alt="Website Logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <!-- Wrapper to group image with profile heading! -->
          <div class="profile__wrapper">
            <div class="profile__avatar-wrapper">
              <button type="button" class="profile__avatar-btn">
                <img class="profile__edit-icon" src="<%=require('./images/edit-icon_white.png')%>" alt="Edit Icon" />
              </button>  
            <img class="profile__image" src="" alt="Avatar Image" />
            </div>
            <!-- Need Wrapper to group heading elements -->
            <div class="profile__header">
              <!-- Wrapper to seperate title & subtitle from edit btn! -->
              <div class="profile__header-wrapper">
                <h1 class="profile__header-title">Bessie Coleman</h1>
                <p class="profile__header-subtitle">Civil Aviator</p>
              </div>
              <button type="button" class="profile__edit-btn">
                <img class="profile__edit-icon" src="<%=require('./images/edit-icon.svg')%>" alt="Edit Icon" />
                Edit Profile
              </button>
            </div>
          </div>
          <button class="profile__new-post-btn">
            <img class="profile__plus-icon" src="<%=require('./images/plus-icon.svg')%>" alt="Plus Icon" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card__template">
              <li class="card">
                <img class="card__image" alt="" />
                <div class="card__delete-btn"></div>
                <!-- Wrapper to group subtitle and like btn! -->
                <div class="card__subtitle-wrapper">
                  <p class="card__subtitle"></p>
                  <div class="card__like-btn"></div>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2025 © Wyatt Yousey</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <form class="modal__form" novalidate>
            <div class="modal__header">
              <h3 class="modal__title">Edit Profile</h3>
              <button type="button" class="modal__close-btn" aria-label="Close modal"></button>
            </div>
            <fieldset class="modal__fieldset">
              <label for="name" class="modal__label">
                Name
                <input
                  type="text"
                  id="name"
                  name="name"
                  class="modal__input"
                  placeholder="Type your name"
                  minlength="2"
                  maxlength="40"
                  required
                />
                <span class="name-error modal__error"></span>
              </label>
            </fieldset>
            <fieldset class="modal__fieldset">
              <label for="description" class="modal__label">
                Description
                <input
                  type="text"
                  id="description"
                  name="description"
                  class="modal__input"
                  placeholder="Describe yourself"
                  minlength="2"
                  maxlength="200"
                  required
                />
                <span class="description-error modal__error"></span>
              </label>
            </fieldset>
            <button type="submit" class="modal__save-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <form class="modal__form" novalidate>
            <div class="modal__header">
              <h3 class="modal__title">New Post</h3>
              <button type="button" class="modal__close-btn" aria-label="Close modal"></button>
            </div>
            <fieldset class="modal__fieldset">
              <label for="image-link" class="modal__label">
                Image Link
                <input
                  type="url"
                  id="image-link"
                  name="image-link"
                  class="modal__input"
                  placeholder="Paste a link to the picture"
                  required
                />
                <span class="image-link-error modal__error"></span>
              </label>
            </fieldset>
            <fieldset class="modal__fieldset">
              <label for="caption" class="modal__label">
                Caption
                <input
                  type="text"
                  id="caption"
                  name="caption"
                  class="modal__input"
                  placeholder="Type your caption"
                  minlength="2"
                  maxlength="30"
                  required
                />
                <span class="caption-error modal__error"></span>
              </label>
            </fieldset>
            <button type="submit" class="modal__save-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="modal__preview">
        <div class="modal__preview-container">
          <img
            class="modal__image"
            src="<%=require('./images/1-photo-by-moritz-feldmann-from-pexels.jpg')%>"
            alt="Preview Image"
          />
          <button
            type="button"
            class="modal__close-btn modal__preview-close-btn"
            aria-label="Close modal"
          ></button>
          <div class="modal__subtitle-container">
            <p class="modal__subtitle"></p>
          </div>
        </div>
      </div>
       <div class="modal" id="avatar-modal">
        <div class="modal__container">
          <form class="modal__form" novalidate>
            <div class="modal__header">
              <h3 class="modal__title">Edit profile avatar</h3>
              <button type="button" class="modal__close-btn" aria-label="Close modal"></button>
            </div>
            <fieldset class="modal__fieldset">
              <label for="avatar-link" class="modal__label">
                Profile Picture
                <input
                  type="url"
                  id="avatar-link"
                  name="avatar-link"
                  class="modal__input"
                  placeholder="Paste the link to an image"
                  required
                />
                <span class="avatar-link-error modal__error"></span>
              </label>
            </fieldset>
            <button type="submit" id="modal__save-btn" class="modal__save-btn">Save</button>
          </form>
        </div>
      </div>
       <div class="modal" id="delete-modal">
         <div class="modal__container modal__delete-container">
           <form class="modal__form" novalidate>
             <div class="modal__header">
               <h3 class="modal__title modal__delete-title">Are you sure you want to delete this image?</h3>
              </div>
              <div class="modal__btn-container">
                <button type="submit" id="modal__delete-btn" class="modal__save-btn modal__delete">Delete</button>
                <button type="button" id="modal__cancel-btn" class="modal__save-btn modal__cancel">Cancel</button>
              </div>
            </form>
          </div>
          <button type="button" class="modal__close-btn delete-close-btn" aria-label="Close modal"></button>
      </div>
    </div>
  </body>
</html>
